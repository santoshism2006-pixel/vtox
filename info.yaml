# Tiny Tapeout project information

project:
  title:        "VTOX"
  author:       "Santoshi"
  discord:      "Santoshi2006"
  description:  "RTL TO GDSII flow implementation for ALU design"
  language:     "Verilog"
  clock_hz:     100000

  # Tile size used for the design
  tiles: "1x1"

  # Top module name
  top_module:  "tt_um_fw_signature_verify"

  # Source files
  source_files:
    - "src/tt_um_fw_signature_verify.v"

# Pinout configuration
pinout:

  # Dedicated inputs
  ui[0]: "Firmware Data Bit 0"
  ui[1]: "Firmware Data Bit 1"
  ui[2]: "Firmware Data Bit 2"
  ui[3]: "Firmware Data Bit 3"
  ui[4]: "Firmware Data Bit 4"
  ui[5]: "Firmware Data Bit 5"
  ui[6]: "Firmware Data Bit 6"
  ui[7]: "Firmware Data Bit 7"

  # Dedicated outputs
  uo[0]: "Verification Valid"
  uo[1]: "Verification Done"
  uo[2]: "Unused"
  uo[3]: "Unused"
  uo[4]: "Unused"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "Signature Bit 0"
  uio[1]: "Signature Bit 1"
  uio[2]: "Signature Bit 2"
  uio[3]: "Signature Bit 3"
  uio[4]: "Signature Bit 4"
  uio[5]: "Signature Bit 5"
  uio[6]: "Signature Bit 6"
  uio[7]: "Signature Bit 7"

# Do not change
yaml_version: 6
